# =========================================================
# Application
# =========================================================
spring.application.name=${APP_NAME:bridge}
server.port=${SERVER_PORT:8080}
spring.profiles.active=dev

# =========================================================
# Database - MySQL
# =========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:CollegeBridge}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:shroyash}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# File Upload
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/

# =========================================================
# Email - SMTP
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# Redis
# =========================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# =========================================================
# JWT - RSA Keys
# =========================================================
app.jwt.privateKeyPath=classpath:keys/private_key.pem
app.jwt.publicKeyPath=classpath:keys/public_key.pem

jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# =========================================================
# OTP
# =========================================================
otp.expiration.minutes=5

# =========================================================
# Firebase
# =========================================================
firebase.config.path=${FIREBASE_CONFIG_PATH:keys/firebase-service-account.json}

# =========================================================
# Notification Worker
# =========================================================
notification.worker.poll-interval-ms=3000
notification.worker.lease-duration-seconds=120

# =========================================================
# Cloudinary
# =========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================================================
# CORS and Application URLs
# =========================================================
app.cors.allowed-origins=*
app.frontend-url=http://localhost:3000
app.backend-url=http://localhost:8080

# =========================================================
# AI-Powered Daily Holiday Announcements
# =========================================================

# Holiday API
holiday.api.base-url=https://calendar.newsbihani.com
holiday.api.type=public

# BS years to synchronize (monthly refresh)
holiday.sync.years[0]=2083

# Gemini AI
holiday.ai.api-key=${GEMINI_API_KEY:}
holiday.ai.model=gemini-2.5-flash
holiday.ai.timeout-seconds=20

# Holiday notice settings
holiday.notice.institution-name=${COLLEGE_NAME:the college}
holiday.notice.audience-topic=college_notices
holiday.notice.auto-send-holiday-variant=true
holiday.notice.auto-select-at=07:00
holiday.notice.language=English
holiday.notice.ai-max-attempts=3

# Holiday scheduling (Asia/Kathmandu)
holiday.schedule.sync=0 0 2 1 * *
holiday.schedule.draft=0 0 18 * * *
holiday.schedule.remind-evening=0 0 20 * * *
holiday.schedule.remind-morning=0 0 6 * * *
holiday.schedule.publish=0 */10 7-19 * * *

# =========================================================
# Jackson
# =========================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kathmandu

# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info

# =========================================================
# Error Handling
# =========================================================
server.error.include-message=never
server.error.include-binding-errors=never

# =========================================================
# SpringDoc / Swagger
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================================
# Static Resources
# =========================================================
spring.web.resources.add-mappings=true

# =========================================================
# Servlet Encoding and Session
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# =========================================================
# Graceful Shutdown
# =========================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
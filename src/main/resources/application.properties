
spring.application.name=${APP_NAME:bridge}
server.port=${SERVER_PORT:8080}


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:CollegeBridge}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:shroyash}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}


app.jwt.privateKeyPath=classpath:keys/private_key.pem
app.jwt.publicKeyPath=classpath:keys/public_key.pem


firebase.config.path=${FIREBASE_CONFIG_PATH:keys/firebase-service-account.json}
notification.worker.poll-interval-ms=3000
notification.worker.lease-duration-seconds=120


cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=


app.upload.dir=uploads/


jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000


otp.expiration.minutes=5


app.cors.allowed-origins=*


app.frontend-url=http://localhost:3000
app.backend-url=http://localhost:8080


spring.profiles.active=dev


spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kathmandu


logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN


management.endpoints.web.exposure.include=health,info


server.error.include-message=never
server.error.include-binding-errors=never


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


spring.web.resources.add-mappings=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

name: Frontend CI (Flutter)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bridge_mobile/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bridge_mobile/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      run_analyzer:
        description: 'Run Flutter Analyzer (true/false)'
        required: false
        default: 'true'

jobs:
  build-and-test:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java for Android Toolchain
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd bridge_mobile
          flutter pub get

      - name: Run Dart & Flutter Static Analysis
        if: ${{ github.event.inputs.run_analyzer != 'false' }}
        run: |
          cd bridge_mobile
          flutter analyze --no-fatal-infos

      - name: Run Frontend Unit & Widget Tests
        run: |
          cd bridge_mobile
          flutter test
